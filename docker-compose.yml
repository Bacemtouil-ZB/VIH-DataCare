version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"  # Port de dev Vite
    depends_on:
      - backend
    environment:
      - VITE_API_URL=${VITE_API_URL}


  backend:
    build:
      context: ./backend
    ports:
      - "${PORT}:${PORT}"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db        
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - PORT=${PORT}
    depends_on:
      - db
  db:
    image: postgres:13
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
