services:
  db:
    image: postgres:16-alpine
    container_name: vih_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Stockage persistant des donnees PostgreSQL.
      - db_data:/var/lib/postgresql/data
      # Script d'initialisation execute uniquement sur une base vide.
      - ./docker-share/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # Attend que PostgreSQL soit pret avant de lancer l'API.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vih_backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Dans le reseau Compose, le backend joint Postgres via le nom du service.
      DB_HOST: db
      DB_PORT: 5432
      NODE_ENV: production
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Verifie l'endpoint de sante expose par l'API.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL injectee au build Vite. La valeur par defaut vise l'API locale.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: vih_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
